<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TGX QUANTUM — All-in-One Cloud Portal</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

  <!-- EMBEDDED GAME BROWSER FRAME -->
  <iframe id="gameFrame" src="https://www.qf7auv57duu4dxj.com/#/saasLottery/WinGo?gameCode=WinGo_1M&lottery=WinGo"></iframe>

  <!-- FLOATING MOD CONTROLLER HUD -->
  <div id="quantumHud">
    <div class="hud-header">
      <div class="hud-brand">
        <i class="fa-solid fa-bolt-lightning" style="color:#f7c873;"></i>
        <span>TGX QUANTUM 24/7</span>
      </div>
      <div class="hud-timer" id="hudTimer">--s</div>
    </div>

    <!-- SIGNAL PREDICTION CARD -->
    <div class="hud-signal-box">
      <div class="hud-tag">QUANTUM 1-MIN SIGNAL</div>
      <div class="hud-sig-val" id="hudSignal">SYNCING...</div>
      <div class="hud-stake" id="hudStake">Stake: ₹4 (Martingale)</div>
    </div>

    <!-- LIVE METRICS -->
    <div class="hud-meta">
      <div class="meta-row">
        <span>Target Round:</span>
        <strong id="hudPeriod">--</strong>
      </div>
      <div class="meta-row">
        <span>Live Balance:</span>
        <strong id="hudBalance" style="color:#f7c873;">₹345.84</strong>
      </div>
      <div class="meta-row">
        <span>Status:</span>
        <strong id="hudStatus" style="color:#00e676;">READY</strong>
      </div>
    </div>

    <!-- ACTION BUTTON -->
    <button class="hud-btn hud-btn-start" id="btnToggle">
      <i class="fa-solid fa-play"></i> START CLOUD AUTO-BET
    </button>
  </div>

  <!-- FLOATING OPEN SHORTCUT ICON -->
  <div id="hudShortcut" onclick="toggleHud()"><i class="fa-solid fa-bolt"></i></div>

  <script src="app.js"></script>
</body>
</html>
